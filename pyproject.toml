[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openrestore"
version = "0.1.0"
description = "An open-source bedside sleep clock: sunrise alarm, wind-down routines, and a sound machine."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    # uvicorn has no WebSocket support at all without one of its optional
    # backends installed — with neither present, `/api/events` (task 07's
    # WebSocket transport, and the web UI's only live-update channel, task
    # 08) accepts the TCP connection but then 404s the upgrade, silently,
    # since routing falls through to a plain-HTTP 404 once the upgrade
    # itself never happens. Task 07's own test suite never caught this: it
    # drives the app through Starlette's in-process `TestClient`, which
    # never touches uvicorn's real socket/upgrade handling. `wsproto` is
    # pure Python (no compiled extension), so it doesn't touch the
    # no-C-extension-without-an-arm64-wheel constraint (docs/00-overview.md)
    # the way `websockets`' optional speedups can.
    "wsproto",
    "pydantic",
    "pyyaml",
    "structlog",
    "aiosqlite",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "mypy",
    "types-PyYAML",
    # starlette.testclient (used by FastAPI's TestClient, task 07's
    # REST/WebSocket test harness) requires this to drive the ASGI app
    # in-process. Dev-only — never imported by the daemon itself, so it
    # doesn't touch the arm64-wheel constraint on the runtime dependencies.
    "httpx2",
]

[project.scripts]
openrestore = "openrestore.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# FastAPI's dependency injection idiom is `param: T = Depends(...)` in the
# signature itself — the call-in-default bugbear rule (B008) exists to catch
# accidental shared mutable defaults, which this isn't; FastAPI calls
# `Depends()` fresh per request. This is the documented, required pattern.
"src/openrestore/api/*.py" = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
